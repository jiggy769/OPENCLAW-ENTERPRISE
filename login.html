<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦅 OPEN CLAW ENTERPRISE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(ellipse at top, #1a0a0a 0%, #0a0a0a 50%, #000000 100%);
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        body::before, body::after {
            content: '';
            position: fixed;
            top: 0;
            width: 100px;
            height: 100vh;
            background: repeating-linear-gradient(90deg, transparent, transparent 10px, rgba(220,38,38,0.1) 10px, rgba(220,38,38,0.1) 12px);
            pointer-events: none;
        }
        body::before { left: 0; }
        body::after { right: 0; }

        .login-box {
            background: linear-gradient(135deg, rgba(20,20,20,0.95), rgba(10,10,10,0.98));
            border: 2px solid transparent;
            border-image: linear-gradient(135deg, #dc2626, #0d9488, #dc2626) 1;
            border-radius: 20px;
            padding: 50px 40px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 0 60px rgba(220,38,38,0.3), inset 0 0 60px rgba(13,148,136,0.05);
            backdrop-filter: blur(10px);
            position: relative;
        }

        .claw-icon {
            font-size: 80px;
            display: block;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(220,38,38,0.8), 0 0 60px rgba(220,38,38,0.4);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #dc2626, #ff6b6b, #0d9488);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #0d9488;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .version {
            color: #666;
            font-size: 11px;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #333;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-family: 'Rajdhani', sans-serif;
            transition: all 0.3s;
            outline: none;
            margin: 10px 0;
        }

        input:focus {
            border-color: #dc2626;
            box-shadow: 0 0 20px rgba(220,38,38,0.3);
        }

        input::placeholder { color: #555; }

        .btn {
            width: 100%;
            padding: 16px;
            margin: 10px 0;
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Orbitron', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before { left: 100%; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(220,38,38,0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .code-display-box {
            background: linear-gradient(135deg, rgba(220,38,38,0.1), rgba(13,148,136,0.1));
            border: 2px solid #dc2626;
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            display: none;
        }

        .code-label {
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        .code-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 42px;
            font-weight: 900;
            color: #dc2626;
            letter-spacing: 12px;
            animation: glow 1.5s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(220,38,38,0.8); }
            to { text-shadow: 0 0 40px rgba(220,38,38,1), 0 0 80px rgba(13,148,136,0.3); }
        }

        .status {
            margin: 12px 0;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }
        .status.error { background: rgba(220,38,38,0.15); color: #ff6b6b; border: 1px solid rgba(220,38,38,0.3); }
        .status.success { background: rgba(13,148,136,0.15); color: #14b8a6; border: 1px solid rgba(13,148,136,0.3); }

        .hidden { display: none !important; }

        .powered-by {
            margin-top: 25px;
            color: #333;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
        .powered-by span { color: #0d9488; }
    </style>
</head>
<body>
    <div class="login-box">
        <span class="claw-icon">🦅</span>
        <h1>OPEN CLAW</h1>
        <div class="subtitle">ENTERPRISE</div>
        <div class="version">AI AGENT SYSTEM v4.0</div>

        <!-- Step 1: Email -->
        <div id="step1">
            <input type="email" id="emailInput" placeholder="ENTER YOUR EMAIL ADDRESS">
            <button class="btn" id="sendBtn" onclick="sendCode()">INITIALIZE ACCESS</button>
        </div>

        <!-- Code display (fallback) -->
        <div id="codeDisplayBox" class="code-display-box">
            <div class="code-label">YOUR VERIFICATION CODE</div>
            <div class="code-number" id="codeNumber"></div>
        </div>

        <!-- Step 2: Code -->
        <div id="step2" class="hidden">
            <input type="text" id="codeInput" placeholder="ENTER 6-DIGIT CODE" maxlength="6">
            <button class="btn" id="verifyBtn" onclick="verifyCode()">AUTHENTICATE</button>
        </div>

        <div id="status" class="status"></div>

        <div class="powered-by">Powered by <span>GROQ AI</span> + <span>LLAMA 3.3</span></div>
    </div>

    <script>
        const API_URL = 'https://openclaw-enterprise-production-57a3.up.railway.app';
        let userEmail = '';

        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status ' + (type || '');
            el.style.display = 'block';
            if (type !== 'success') setTimeout(() => el.style.display = 'none', 5000);
        }

        async function sendCode() {
            userEmail = document.getElementById('emailInput').value.trim();

            if (!userEmail || !userEmail.includes('@')) {
                showStatus('Please enter a valid email address.', 'error');
                return;
            }

            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            btn.textContent = 'SENDING...';
            showStatus('Sending verification code...', '');

            try {
                const res = await fetch(`${API_URL}/api/send-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail })
                });

                const data = await res.json();

                if (data.success) {
                    // Show fallback code if email fails
                    if (data.fallback && data.code) {
                        document.getElementById('codeNumber').textContent = data.code;
                        document.getElementById('codeDisplayBox').style.display = 'block';
                        showStatus('Email unavailable — use code above', 'success');
                    } else {
                        showStatus('✓ Code sent to ' + userEmail, 'success');
                    }
                    document.getElementById('step2').classList.remove('hidden');
                    document.getElementById('codeInput').focus();
                } else {
                    showStatus(data.error || 'Failed to send code', 'error');
                    btn.disabled = false;
                    btn.textContent = 'INITIALIZE ACCESS';
                }
            } catch (err) {
                showStatus('Connection failed: ' + err.message, 'error');
                btn.disabled = false;
                btn.textContent = 'INITIALIZE ACCESS';
            }
        }

        async function verifyCode() {
            const code = document.getElementById('codeInput').value.trim();

            if (!code || code.length !== 6) {
                showStatus('Please enter the 6-digit code.', 'error');
                return;
            }

            const btn = document.getElementById('verifyBtn');
            btn.disabled = true;
            btn.textContent = 'VERIFYING...';
            showStatus('Authenticating...', '');

            try {
                const res = await fetch(`${API_URL}/api/verify-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, code: code })
                });

                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('userSession', JSON.stringify(data.session));
                    showStatus('✓ Access granted! Loading...', 'success');
                    setTimeout(() => window.location.href = '/chat', 1200);
                } else {
                    showStatus(data.error || 'Invalid code', 'error');
                    btn.disabled = false;
                    btn.textContent = 'AUTHENTICATE';
                }
            } catch (err) {
                showStatus('Authentication error: ' + err.message, 'error');
                btn.disabled = false;
                btn.textContent = 'AUTHENTICATE';
            }
        }

        // Enter key support
        document.addEventListener('keypress', e => {
            if (e.key === 'Enter') {
                if (!document.getElementById('step2').classList.contains('hidden')) {
                    verifyCode();
                } else {
                    sendCode();
                }
            }
        });
    </script>
</body>
</html>
